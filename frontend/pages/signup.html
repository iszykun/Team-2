<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RP Fitness Signup</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <section class="auth-panel">
      <span class="eyebrow">Create account</span>
      <h1>Join RP Fitness</h1>
      <p>Start tracking your wellness routine and workouts in minutes.</p>
      <div class="form-stack">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button onclick="signup()">Create account</button>
        <p id="message" class="form-message"></p>
      </div>
      <p>Already have an account? <a href="/pages/login.html">Sign in</a></p>
    </section>
    <section class="auth-panel brand-panel">
      <img class="logo" src="/assets/images/rp-logo.png" alt="RP logo">
      <h2>Stay on top of your fitness goals</h2>
      <p>Simple, motivating wellness tracking for student life.</p>
    </section>
  </div>
  <script src="/src/app.js"></script>
</body>
</html>
