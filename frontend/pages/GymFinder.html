<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Finder</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/assets/images/rp-logo.png" alt="RP logo">
        <div><strong>RP Fitness</strong><span>Student Portal</span></div>
      </div>
      <nav class="nav-links">
        <a href="/pages/dashboard.html">Dashboard</a>
        <a href="/pages/GymFinder.html">Gym Finder</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div>
          <span class="eyebrow">Facilities</span>
          <h1>Nearby Gym & Track Finder</h1>
          <p>Search for gyms and running tracks near your location.</p>
        </div>
      </header>
      <section class="card">
        <form id="finder-form" class="stacked-form">
          <label>
            Latitude
            <input id="lat" name="lat" type="number" step="0.0001" value="1.4365" required>
          </label>
          <label>
            Longitude
            <input id="lng" name="lng" type="number" step="0.0001" value="103.7889" required>
          </label>
          <label>
            Type
            <select id="type" name="type">
              <option value="all">All</option>
              <option value="gym">Gym</option>
              <option value="track">Track</option>
            </select>
          </label>
          <button type="submit">Search</button>
        </form>
        <div id="results" class="grid"></div>
      </section>
    </main>
  </div>
  <script type="module">
    import { searchFacilities } from '/src/services/facilities.js';
    import { renderFacilityList } from '/src/components/GymFinder.jsx';

    const form = document.getElementById('finder-form');
    const results = document.getElementById('results');

    async function handleSearch(event) {
      event.preventDefault();
      const payload = {
        lat: document.getElementById('lat').value,
        lng: document.getElementById('lng').value,
        type: document.getElementById('type').value,
        limit: 10
      };
      const data = await searchFacilities(payload);
      results.innerHTML = renderFacilityList(data);
    }

    form.addEventListener('submit', handleSearch);
    handleSearch({ preventDefault() {} });
  </script>
</body>
</html>
