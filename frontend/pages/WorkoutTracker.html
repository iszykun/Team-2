<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/assets/images/rp-logo.png" alt="RP logo">
        <div><strong>RP Fitness</strong><span>Student Portal</span></div>
      </div>
      <nav class="nav-links">
        <a href="/pages/dashboard.html">Dashboard</a>
        <a href="/pages/CalorieTracker.html">Calories</a>
        <a href="/pages/WorkoutTracker.html" class="active">Workouts</a>
        <a href="/pages/DailyGoals.html">Daily Goals</a>
        <button onclick="logout()">Logout</button>
      </nav>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div>
          <span class="eyebrow">Fitness logs</span>
          <h1>Workout Tracker</h1>
          <p>Record sessions, edit entries, and review your workout history.</p>
        </div>
      </header>
      <section class="grid">
        <article class="card span-6">
          <h2>Log a workout</h2>
          <form id="workoutForm" onsubmit="event.preventDefault(); saveWorkout();" class="form-stack">
            <label for="workoutType">Workout type</label>
            <select id="workoutType" required>
              <option value="">Select workout type</option>
              <option value="Gym / Weightlifting">Gym / Weightlifting</option>
              <option value="Running">Running</option>
              <option value="Cycling">Cycling</option>
              <option value="Swimming">Swimming</option>
              <option value="Yoga / Stretching">Yoga / Stretching</option>
              <option value="Other">Other</option>
            </select>
            <div id="typeSpecificFields"></div>
            <input id="workoutExercise" placeholder="Exercise name" required>
            <input id="workoutDuration" type="number" min="1" step="1" placeholder="Duration (min)" required>
            <input id="workoutCalories" type="number" min="1" step="1" placeholder="Calories burned" required>
            <input id="workoutDate" type="date" required>
            <label for="workoutDifficulty">Difficulty</label>
            <select id="workoutDifficulty" required>
              <option value="">Select difficulty</option>
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
            <label for="workoutMood">Mood before workout</label>
            <select id="workoutMood" required>
              <option value="">Select mood</option>
              <option value="😴 Tired">😴 Tired</option>
              <option value="😐 Okay">😐 Okay</option>
              <option value="💪 Energized">💪 Energized</option>
            </select>
            <label for="workoutNotes">Notes</label>
            <textarea id="workoutNotes" rows="3" placeholder="Add any notes or reflection"></textarea>
            <label for="workoutTags">Tags</label>
            <input id="workoutTags" placeholder="#legday #cardio #pb">
            <button type="submit">Save workout</button>
            <p id="workoutMessage" class="form-message"></p>
          </form>
        </article>
        <article class="card span-6">
          <h2>Workout history</h2>
          <label for="workoutFilter">Filter by type</label>
          <select id="workoutFilter" onchange="filterWorkouts()">
            <option value="All">All</option>
            <option value="Gym / Weightlifting">Gym / Weightlifting</option>
            <option value="Running">Running</option>
            <option value="Cycling">Cycling</option>
            <option value="Swimming">Swimming</option>
            <option value="Yoga / Stretching">Yoga / Stretching</option>
            <option value="Other">Other</option>
          </select>
          <ul id="workoutList" class="food-list"></ul>
        </article>
      </section>
    </main>
  </div>
  <script src="/src/app.js"></script>
</body>
</html>
